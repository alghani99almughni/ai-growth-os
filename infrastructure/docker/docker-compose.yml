services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: growth_os
      POSTGRES_USER: growth
      POSTGRES_PASSWORD: growth
    ports:
      - "5432:5432"
    volumes:
      - growth_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  growth_pg:
