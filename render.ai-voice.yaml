# Independent AI Voice Render Blueprint
# Deploy this blueprint from the ai-voice branch only.
services:
  - type: web
    name: ai-voice-standalone-api
    runtime: python
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: uvicorn app.main:app --app-dir apps/api --host 0.0.0.0 --port $PORT --workers 2 --timeout-keep-alive 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DATABASE_URL
        fromDatabase:
          name: ai-voice-standalone-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://ai-voice-standalone-web.onrender.com
      - key: PUBLIC_APP_URL
        value: https://ai-voice-standalone-web.onrender.com
      - key: WHATSAPP_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATION_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
  - type: web
    name: ai-voice-standalone-web
    runtime: node
    plan: starter
    region: singapore
    autoDeployTrigger: commit
    buildCommand: cd apps/ai-voice-standalone/web && npm install && npm run build
    startCommand: cd apps/ai-voice-standalone/web && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ai-voice-standalone-api.onrender.com
databases:
  - name: ai-voice-standalone-db
    plan: starter
    region: singapore
    postgresMajorVersion: "18"
