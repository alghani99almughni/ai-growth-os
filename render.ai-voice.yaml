# Single AI Voice web service: Next.js frontend + FastAPI backend in one container.
# Database and Redis are managed data resources, not additional application servers.
services:
  - type: web
    name: ai-voice
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./deploy/ai-voice/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DATABASE_URL
        fromDatabase:
          name: ai-voice-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ai-voice-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://ai-voice.onrender.com
      - key: PUBLIC_APP_URL
        value: https://ai-voice.onrender.com
      - key: API_PUBLIC_URL
        value: https://ai-voice.onrender.com
      - key: WHATSAPP_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATION_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: ""
  - type: keyvalue
    name: ai-voice-redis
    plan: starter
    region: singapore
    ipAllowList:
      - source: 0.0.0.0/32
        description: Private application access only
    maxmemoryPolicy: noeviction

databases:
  - name: ai-voice-db
    plan: starter
    region: singapore
    postgresMajorVersion: "18"
