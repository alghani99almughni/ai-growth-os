name: Voice Agent 50-Scenario Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  voice-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install voice regression dependencies
        run: |
          python -m pip install -q websocket-client playwright
          python -m playwright install chromium
      - name: Run 50 live voice-agent scenarios
        env:
          API_URL: https://ai-growth-os-api.onrender.com
          BUSINESS_SLUG: ss-nutritions
        run: |
          python - <<'PY'
          import os, time, statistics, requests, sys
          from playwright.sync_api import sync_playwright

          base=os.environ["API_URL"].rstrip("/")
          slug=os.environ["BUSINESS_SLUG"]
          scenarios=[
            ("hours","What are your timings?"),
            ("hours","What time do you open?"),
            ("hours","What time do you close?"),
            ("hours","Are you open on Monday?"),
            ("hours","Are you open on Sunday?"),
            ("hours","Tell me your business hours."),
            ("hours","What are your opening hours?"),
            ("hours","When are you open?"),
            ("hours","What time are you available?"),
            ("hours","Can you tell me the timings please?"),
            ("hours","What are your working hours?"),
            ("hours","Are you closed today?"),
            ("hours","When do you start in the morning?"),
            ("hours","When do you finish for the day?"),
            ("hours","What is your schedule?"),
            ("general","Hello"),
            ("general","Hi there"),
            ("general","Good morning"),
            ("general","Good evening"),
            ("general","Thank you"),
            ("general","Thanks, that helps"),
            ("general","Can you help me?"),
            ("general","I have a question"),
            ("general","I want some information"),
            ("general","Tell me about SS Nutritions"),
            ("contact","Where are you located?"),
            ("contact","What is your address?"),
            ("contact","How can I contact you?"),
            ("contact","Can I speak with someone?"),
            ("contact","I want to visit you"),
            ("service","What services do you provide?"),
            ("service","What wellness support do you offer?"),
            ("service","Do you provide nutrition guidance?"),
            ("service","Tell me about your wellness programs"),
            ("service","How much does it cost?"),
            ("service","What are your prices?"),
            ("booking","I want to book an appointment"),
            ("booking","Can I schedule a consultation?"),
            ("booking","I need an appointment tomorrow"),
            ("booking","Can you reserve a slot for me?"),
            ("booking","I want to speak to a nutrition expert"),
            ("multilingual","మీ సమయాలు ఏమిటి?"),
            ("multilingual","మీరు ఎప్పుడు తెరిచి ఉంటారు?"),
            ("multilingual","आपके समय क्या हैं?"),
            ("multilingual","आप कब खुले रहते हैं?"),
            ("multilingual","நேரம் என்ன?"),
            ("context","Actually I meant the timings"),
            ("context","Can you repeat the timings?"),
            ("context","Which days are you open?"),
            ("context","Thanks. What time do you open?")
          ]

          s=requests.Session()
          s.headers.update({"Content-Type":"application/json"})
          expected_commit=os.environ.get("GITHUB_SHA","")
          deadline=time.time()+180
          while True:
              r=s.get(base+"/health",timeout=20)
              r.raise_for_status()
              deployed=r.json().get("commit","")
              print(f"DEPLOYED_COMMIT={deployed}")
              if deployed==expected_commit:
                  break
              if time.time()>=deadline:
                  raise RuntimeError(f"Render did not deploy expected commit {expected_commit}; current={deployed}")
              time.sleep(5)

          start=time.perf_counter()
          r=s.post(f"{base}/api/v1/public/business/{slug}/call",
                   json={"name":"Voice Regression","phone":"+919999999999"},timeout=20)
          r.raise_for_status()
          call=r.json()
          call_id=call["call_id"]
          conversation_id=None
          latencies=[]
          failures=[]
          hours_failures=[]

          for i,(kind,text) in enumerate(scenarios,1):
              t=time.perf_counter()
              try:
                  payload={"transcript":text,"call_id":call_id,"conversation_id":conversation_id,"channel":"voice"}
                  rr=s.post(f"{base}/api/v1/public/business/{slug}/voice/turn",json=payload,timeout=30)
                  elapsed=time.perf_counter()-t
                  latencies.append(elapsed)
                  if rr.status_code>=500:
                      failures.append((i,text,rr.status_code,rr.text[:300]))
                      continue
                  data=rr.json()
                  if not data.get("reply"):
                      failures.append((i,text,"EMPTY",""))
                  conversation_id=data.get("conversation_id") or conversation_id
                  if kind=="hours" and (not data.get("knowledge_hit") or data.get("handoff_required")):
                      hours_failures.append((i,text,data))
              except Exception as exc:
                  failures.append((i,text,"EXCEPTION",str(exc)))

          p50=statistics.median(latencies) if latencies else 999
          p95=sorted(latencies)[max(0,int(len(latencies)*0.95)-1)] if latencies else 999
          total=time.perf_counter()-start

          print(f"SCENARIOS={len(scenarios)} COMPLETED={len(latencies)} FAILURES={len(failures)}")
          print(f"TOTAL_SECONDS={total:.2f} P50_SECONDS={p50:.2f} P95_SECONDS={p95:.2f}")
          if hours_failures:
              print("HOURS_FAILURES:")
              for x in hours_failures: print(x)
          if failures:
              print("FAILURES:")
              for x in failures: print(x)

          if failures or hours_failures:
              sys.exit(1)
          if p95>20:
              print("P95 latency exceeded 20 seconds")
              sys.exit(1)
          print("HTTP VOICE REGRESSION: PASS")

          # Multi-turn booking state acceptance against the deployed backend.
          print("BOOKING STATE REGRESSION: START")
          bc=s.post(f"{base}/api/v1/public/business/{slug}/call",json={"name":"Booking Regression","phone":"+919999999998"},timeout=20)
          bc.raise_for_status()
          bcid=bc.json()["call_id"]
          bconv=None
          def booking_turn(text):
              global bconv
              rr=s.post(f"{base}/api/v1/public/business/{slug}/voice/turn",json={"transcript":text,"call_id":bcid,"conversation_id":bconv,"channel":"voice"},timeout=30)
              rr.raise_for_status()
              data=rr.json()
              bconv=data.get("conversation_id") or bconv
              return data
          x=booking_turn("I want to book an appointment")
          if not x.get("reply") or not bconv: raise RuntimeError(f"Booking start failed: {x}")
          x=booking_turn("Monday")
          if not x.get("reply"): raise RuntimeError(f"Booking date continuation failed: {x}")
          x=booking_turn("10 AM")
          if not any(k in x.get("reply","").lower() for k in ("confirm","appointment","10")): raise RuntimeError(f"Booking time state failed: {x}")
          bc=s.post(f"{base}/api/v1/public/business/{slug}/call",json={"name":"Hindi Booking Regression","phone":"+919999999997"},timeout=20)
          bc.raise_for_status()
          bcid=bc.json()["call_id"]
          bconv=None
          x=booking_turn("Hindi mein bol sakte hain")
          if "hindi" not in x.get("reply","").lower() and "हिंदी" not in x.get("reply",""): raise RuntimeError(f"Hindi switch failed: {x}")
          x=booking_turn("मुझे अपॉइंटमेंट बुक करना है")
          if "unverified" in x.get("reply","").lower() or not x.get("reply"): raise RuntimeError(f"Hindi booking start failed: {x}")
          x=booking_turn("Monday")
          if not x.get("reply"): raise RuntimeError(f"Hindi date continuation failed: {x}")
          x=booking_turn("10 बजे")
          if "unverified" in x.get("reply","").lower() or not x.get("reply"): raise RuntimeError(f"Hindi booking time failed: {x}")
          print("BOOKING STATE REGRESSION: PASS")

          # Real browser smoke: validates the customer-facing PWA, browser WebSocket
          # upgrade, microphone path and first realtime AI response.
          import time, sys
          from playwright.sync_api import sync_playwright

          page_url="https://ai-growth-os-web.onrender.com/ss-nutritions"
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=[
                  "--use-fake-device-for-media-stream",
                  "--use-fake-ui-for-media-stream",
                  "--autoplay-policy=no-user-gesture-required",
              ])
              context=browser.new_context(permissions=["microphone"])
              page=context.new_page()

              # Headless Chromium does not expose a real SpeechRecognition service.
              # Inject one deterministic recognition turn so this smoke test exercises
              # the actual PWA call -> /voice/turn -> transcript path without any
              # external AI provider credentials.
              page.add_init_script("""
                (() => {
                  class FakeSpeechRecognition {
                    constructor() {
                      this.continuous = true;
                      this.interimResults = false;
                      this.maxAlternatives = 1;
                      this.lang = "en-IN";
                      this.started = false;
                    }
                    start() {
                      if (this.started) return;
                      this.started = true;
                      setTimeout(() => {
                        if (!this.onresult) return;
                        const result = {
                          isFinal: true,
                          0: { transcript: "What are your timings?" }
                        };
                        this.onresult({
                          resultIndex: 0,
                          results: [result]
                        });
                      }, 250);
                    }
                    stop() {
                      this.started = false;
                    }
                  }
                  window.SpeechRecognition = FakeSpeechRecognition;
                  window.webkitSpeechRecognition = FakeSpeechRecognition;
                })();
              """)

              page.goto(page_url,wait_until="networkidle",timeout=60_000)
              page.get_by_role("button",name="Call us").first.click()
              page.get_by_placeholder("Your name").fill("Voice Browser Test")
              page.get_by_placeholder("+91 98765 43210").fill("+919999999999")
              page.get_by_role("button",name="☎ Start call").click()
              page.get_by_text("AI is listening…").wait_for(timeout=20_000)
              page.get_by_text("What are your timings?",exact=False).wait_for(timeout=20_000)
              page.get_by_text("We're open",exact=False).wait_for(timeout=20_000)
              transcript=page.locator(".ss-transcript").inner_text()
              print("BROWSER_BUILT_IN_VOICE_TRANSCRIPT="+transcript.replace("\\n"," | ")[:500])
              if "AI:" not in transcript or "What are your timings?" not in transcript:
                  raise RuntimeError("Built-in browser voice path did not produce the expected AI transcript")
              page.get_by_role("button",name="End call").click()
              browser.close()
          print("BROWSER BUILT-IN VOICE REGRESSION: PASS")
          print("VOICE REGRESSION: PASS")
          PY
