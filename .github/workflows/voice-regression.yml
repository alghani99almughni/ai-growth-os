name: Voice Regression

on:
  push:
    paths:
      - "apps/api/app/**"
      - "apps/api/tests/**"
      - "apps/api/requirements.txt"
      - ".github/workflows/voice-regression.yml"
  pull_request:
    paths:
      - "apps/api/app/**"
      - "apps/api/tests/**"
      - "apps/api/requirements.txt"
      - ".github/workflows/voice-regression.yml"
  workflow_dispatch:

jobs:
  api-voice-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run complete API test suite including async WebCall tests
        run: pytest -q --asyncio-mode=auto
