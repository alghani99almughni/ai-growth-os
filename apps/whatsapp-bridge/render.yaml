services:
  - type: web
    name: ai-growth-whatsapp-bridge
    runtime: node
    plan: free
    buildCommand: cd apps/whatsapp-bridge && npm install
    startCommand: cd apps/whatsapp-bridge && npm start
    envVars:
      - key: BRIDGE_API_KEY
        generateValue: true
      - key: WEBHOOK_URL
        value: https://ai-growth-os-api.onrender.com/api/v1/webhooks/openwa/{tenant_id}
      - key: TENANT_ID
        value: 7c212e33-66ca-4dc0-bbaa-4d2661760af2
      - key: WEBHOOK_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info